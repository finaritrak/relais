[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "relais-llm"
version = "0.1.0"
description = "Self-hosted LLM gateway: local model first, cloud fallback, sensitive data masked before it leaves your network. OpenAI-compatible."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aina Finaritra Rakotonindrainy", email = "aina.finaritra.rak@gmail.com" }]
keywords = ["llm", "gateway", "proxy", "ollama", "anthropic", "claude", "openai", "pii", "redaction", "privacy", "fallback"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: French",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
relais = "relais.cli:main"

[project.urls]
Homepage = "https://github.com/finaritrak/relais"
Issues = "https://github.com/finaritrak/relais/issues"
Changelog = "https://github.com/finaritrak/relais/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/relais"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["relais"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
