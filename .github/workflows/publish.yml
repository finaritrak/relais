name: Publish to PyPI

# Runs when you publish a GitHub Release. Uses PyPI "trusted publishing":
# no token to store — configure it once on pypi.org (see CONTRIBUTING.md).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
